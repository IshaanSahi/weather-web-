spring.application.name=weather-web

# Server Configuration
# Use PORT environment variable from Render, fallback to 8080
server.port=${PORT:8080}

# Production settings
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Logging
logging.level.root=INFO
logging.level.com.weather.weather_web=DEBUG
logging.level.org.springframework.web=DEBUG

# Open-Meteo APIs (no API key required for the free tier)
weather.geocoding.url=https://geocoding-api.open-meteo.com/v1/search
weather.api.url=https://api.open-meteo.com/v1/forecast
